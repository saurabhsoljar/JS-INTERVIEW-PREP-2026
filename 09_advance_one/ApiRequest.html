<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
        body {
            background-color: #212121;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .card {
            background-color: #2c2c2c;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            display: none;
            max-width: 400px;
        }

        .card.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #4CAF50;
            margin-bottom: 20px;
        }

        .name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .username {
            font-size: 18px;
            color: #888;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #444;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
        }

        .stat-label {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }

        .bio {
            margin: 15px 0;
            color: #ccc;
            font-size: 14px;
        }

        .loading {
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body style="background-color: #212121;">
    <button id="showProfile">Show GitHub Profile</button>
    <div id="loading" class="loading" style="display: none;">Loading...</div>
    <div id="card" class="card"></div>
</body>
<script>
    const showButton = document.getElementById('showProfile');
    const cardDiv = document.getElementById('card');
    const loadingDiv = document.getElementById('loading');

    showButton.addEventListener('click', function() {
        // Show loading
        loadingDiv.style.display = 'block';
        cardDiv.classList.remove('show');

        const requestUrl = 'https://api.github.com/users/saurabhsoljar';
        const xhr = new XMLHttpRequest();
        
        xhr.open('GET', requestUrl);
        
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                loadingDiv.style.display = 'none';
                
                if (xhr.status === 200) {
                    const data = JSON.parse(this.responseText);
                    
                    // Create card HTML
                    cardDiv.innerHTML = `
                        <img src="${data.avatar_url}" alt="Profile Picture" class="profile-img">
                        <div class="name">${data.name || 'No Name'}</div>
                        <div class="username">@${data.login}</div>
                        <div class="bio">${data.bio || 'No bio available'}</div>
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-number">${data.followers}</div>
                                <div class="stat-label">Followers</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${data.following}</div>
                                <div class="stat-label">Following</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">${data.public_repos}</div>
                                <div class="stat-label">Repos</div>
                            </div>
                        </div>
                    `;
                    
                    // Show card with animation
                    cardDiv.classList.add('show');
                } else {
                    cardDiv.innerHTML = '<p style="color: red;">Error loading profile</p>';
                    cardDiv.classList.add('show');
                }
            }
        };
        
        xhr.send();
    });
</script>
</html>
